<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="theme-color" content="#020617" />
    <title>Page Not Found | Brent Ogden</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Lato, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020617;
        color: #f8fafc;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: radial-gradient(circle at top, rgba(1, 133, 228, 0.22), transparent 55%), #020617;
      }

      main {
        width: min(38rem, calc(100% - 2rem));
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.82);
        box-sizing: border-box;
      }

      p {
        color: #cbd5e1;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 0.65rem 1rem;
        border-radius: 999px;
        background: #3d86ca;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404 error</p>
      <h1>Page not found</h1>
      <p>The page may have moved, been renamed, or never existed.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
